<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" rx="12" fill="#0f172a"/>
  <rect x="16" y="16" width="768" height="268" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <text x="34" y="46" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">
    TRANSTHORACIC ECHOCARDIOGRAM — APICAL 5-CHAMBER CW DOPPLER
  </text>
  <text x="34" y="66" fill="#94a3b8" font-family="sans-serif" font-size="12">
    Calcified Trileaflet Aortic Valve | LVEF: 58% | Symptomatic Exertional Syncope
  </text>

  <!-- Baseline zero velocity line -->
  <line x1="60" y1="95" x2="480" y2="95" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="30" y="99" fill="#94a3b8" font-family="monospace" font-size="11">0 m/s</text>
  <text x="24" y="170" fill="#94a3b8" font-family="monospace" font-size="11">2 m/s</text>
  <text x="24" y="245" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">4.4 m/s</text>

  <!-- Parabolic CW Doppler Envelopes across Aortic Valve -->
  <path d="M 95,95 Q 145,385 195,95 Z" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2.2"/>
  <path d="M 235,95 Q 285,385 335,95 Z" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2.2"/>
  <path d="M 375,95 Q 425,385 475,95 Z" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2.2"/>

  <!-- Peak Velocity Line -->
  <line x1="60" y1="240" x2="480" y2="240" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Measurement Readout Panel -->
  <rect x="510" y="82" width="250" height="178" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="528" y="110" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">
    Haemodynamic Measurements
  </text>
  <text x="528" y="138" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold">
    Vmax:          4.4 m/s (>= 4.0)
  </text>
  <text x="528" y="164" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold">
    Mean Gradient: 48 mmHg (>= 40)
  </text>
  <text x="528" y="190" fill="#f87171" font-family="monospace" font-size="13" font-weight="bold">
    AVA (Cont Eq): 0.75 cm² (&lt; 1.0)
  </text>
  <text x="528" y="216" fill="#34d399" font-family="monospace" font-size="13">
    LVEF:          58% (Preserved)
  </text>
  <text x="528" y="242" fill="#e2e8f0" font-family="sans-serif" font-size="11">
    Conclusion: Severe High-Gradient AS
  </text>
</svg>
