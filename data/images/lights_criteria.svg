<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <rect width="800" height="260" rx="12" fill="#f8fafc"/>
  <rect x="16" y="16" width="768" height="228" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="34" y="46" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">
    Light&apos;s Criteria for Pleural Effusion Classification (Exudate if ANY 1 of 3 Criteria Met)
  </text>

  <!-- Criterion 1 -->
  <rect x="34" y="68" width="234" height="150" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="50" y="96" fill="#065f46" font-family="sans-serif" font-size="13" font-weight="bold">Criterion 1: Protein Ratio</text>
  <text x="50" y="124" fill="#0f172a" font-family="monospace" font-size="13" font-weight="bold">PF Protein / Serum &gt; 0.5</text>
  <text x="50" y="154" fill="#047857" font-family="sans-serif" font-size="12">Patient: 38 / 68 = 0.56</text>
  <rect x="50" y="174" width="125" height="24" rx="4" fill="#059669"/>
  <text x="60" y="190" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">POSITIVE (Exudate)</text>

  <!-- Criterion 2 -->
  <rect x="283" y="68" width="234" height="150" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="299" y="96" fill="#065f46" font-family="sans-serif" font-size="13" font-weight="bold">Criterion 2: LDH Ratio</text>
  <text x="299" y="124" fill="#0f172a" font-family="monospace" font-size="13" font-weight="bold">PF LDH / Serum LDH &gt; 0.6</text>
  <text x="299" y="154" fill="#047857" font-family="sans-serif" font-size="12">Patient: 190 / 260 = 0.73</text>
  <rect x="299" y="174" width="125" height="24" rx="4" fill="#059669"/>
  <text x="309" y="190" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">POSITIVE (Exudate)</text>

  <!-- Criterion 3 -->
  <rect x="532" y="68" width="234" height="150" rx="8" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="548" y="96" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold">Criterion 3: Absolute LDH</text>
  <text x="548" y="124" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">PF LDH &gt; 2/3 Serum ULN</text>
  <text x="548" y="154" fill="#1d4ed8" font-family="sans-serif" font-size="12">Patient: 190 &gt; 147 (2/3 of 220)</text>
  <rect x="548" y="174" width="125" height="24" rx="4" fill="#0284c7"/>
  <text x="558" y="190" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">POSITIVE (Exudate)</text>
</svg>
